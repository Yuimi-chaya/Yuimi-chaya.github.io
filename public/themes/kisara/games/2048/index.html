<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>2048</title>
  <base href="https://cdn.jsdelivr.net/gh/gabrielecirulli/2048@master/">
  <link href="style/main.css" rel="stylesheet" type="text/css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #faf8ef;
    }

    body {
      margin: 0;
    }

    .container {
      margin-inline: auto;
      transform-origin: top center;
      will-change: transform;
    }
  </style>
</head>
<body data-pagefind-ignore>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
        <div class="best-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
      <a class="restart-button">New Game</a>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
          <a class="keep-playing-button">Keep going</a>
          <a class="retry-button">Try again</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
      </div>

      <div class="tile-container"></div>
    </div>

    <p class="game-explanation">
      <strong class="important">How to play:</strong> Use your <strong>arrow keys</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong>
    </p>
  </div>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
  <script>
    (() => {
      const container = document.querySelector(".container");
      if (!(container instanceof HTMLElement)) return;

      let resizeFrame = 0;
      const fitGame = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          container.style.transform = "none";
          const contentWidth = Math.max(500, container.offsetWidth);
          const contentHeight = Math.max(640, container.scrollHeight);
          const availableWidth = Math.max(280, window.innerWidth - 24);
          const availableHeight = Math.max(220, window.innerHeight - 20);
          const scale = Math.min(1, availableWidth / contentWidth, availableHeight / contentHeight);
          const top = Math.max(8, (window.innerHeight - contentHeight * scale) * 0.5);

          container.style.marginTop = `${top}px`;
          container.style.transform = `scale(${scale})`;
        });
      };

      window.addEventListener("load", fitGame, { once: true });
      window.addEventListener("resize", fitGame, { passive: true });
      fitGame();
    })();
  </script>
</body>
</html>
